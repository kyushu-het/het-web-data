<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYUSHU-HET Preprints & Papers</title>

  <!-- KaTeX CSS / JS の読み込み -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --text-main: #2D2D2D;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --bg-header: #F8FAFC;
      --link-arxiv: #334155;
      --badge-arxiv-bg: #F1F5F9;
      --badge-inspire-text: #1E40AF;
      --badge-inspire-bg: #EFF6FF;
      --badge-pub-text: #065F46;
      --badge-pub-bg: #ECFDF5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: var(--text-main);
      background-color: #ffffff;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .het-container {
      width: 100%;
      margin: 0 auto;
      min-height: 120px;
    }

    /* 検索バー：最上部に固定 */
    .het-toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #ffffff;
      padding: 10px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--border-color);
    }

    .het-search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 460px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #94A3B8;
      pointer-events: none;
    }

    #searchBox {
      width: 100%;
      padding: 8px 32px 8px 34px;
      font-size: 0.88rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #FFFFFF;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #searchBox:focus {
      border-color: #94A3B8;
      box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.15);
    }

    .het-search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94A3B8;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .het-search-clear:hover {
      color: var(--text-main);
    }

    .het-count-badge {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* テーブルのスクロール枠 */
    .het-table-container {
      width: 100%;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .het-table {
      width: 100%;
      min-width: 680px;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .het-table th {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: #F8FAFC;
      color: var(--text-muted);
      font-weight: 600;
      text-align: left;
      padding: 10px 14px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      letter-spacing: 0.02em;
    }

    .het-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .het-table tr:hover td {
      background-color: #FAFAFA;
    }

    .report-no {
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .paper-title {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .paper-authors {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.76rem;
      text-decoration: none;
      line-height: 1.4;
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }

    .badge:hover {
      opacity: 0.75;
      text-decoration: none;
    }

    .badge-arxiv {
      background: var(--badge-arxiv-bg);
      border: 1px solid #CBD5E1;
      color: var(--link-arxiv);
      font-family: monospace;
    }

    .badge-inspire {
      background: var(--badge-inspire-bg);
      border: 1px solid #BFDBFE;
      color: var(--badge-inspire-text);
      font-weight: 500;
    }

    .badge-pub {
      background: var(--badge-pub-bg);
      border: 1px solid #A7F3D0;
      color: var(--badge-pub-text);
      font-weight: 500;
    }

    .status-preprint {
      color: #94A3B8;
      font-size: 0.8rem;
      font-style: italic;
    }

    .center-msg {
      text-align: center;
      padding: 30px 15px;
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <div class="het-container">
    <div class="het-toolbar">
      <div class="het-search-box">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
        <input type="text" id="searchBox" placeholder="Filter by title, author, arXiv ID, or journal..." autocomplete="off">
        <button type="button" id="searchClear" class="het-search-clear" style="display: none;" title="クリア">×</button>
      </div>
      <div id="statusText" class="het-count-badge">Loading publications...</div>
    </div>

    <div class="het-table-container">
      <table class="het-table">
        <thead>
          <tr>
            <th style="width: 14%;">Preprint</th>
            <th style="width: 58%;">Title / Authors</th>
            <th style="width: 14%;">Links</th>   
            <th style="width: 14%;">Publication</th>
          </tr>
        </thead>
        <tbody id="pubTableBody">
          <tr><td colspan="4" class="center-msg">Loading publications...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const DATA_URL = 'https://kyushu-het.github.io/het-web-data/preprints.json';
    let publications = [];

    fetch(DATA_URL + '?t=' + Date.now())
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        publications = data.slice().reverse();
        renderTable(publications);
      })
      .catch(err => {
        console.error('Fetch error:', err);
        document.getElementById('statusText').textContent = 'Error';
        document.getElementById('pubTableBody').innerHTML =
          '<tr><td colspan="4" class="center-msg" style="color:#DC2626;">データの読み込みに失敗しました。</td></tr>';
      });

    function renderTable(list) {
      const tbody = document.getElementById('pubTableBody');
      const status = document.getElementById('statusText');
      status.textContent = `${list.length} 件 / 全 ${publications.length} 件`;

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="center-msg">一致する論文が見つかりませんでした。</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(item => {
        let linksHtml = '<div class="btn-group">';
        if (item.arxivUrl) {
          const rawId = item.arxivId || item.arxivUrl.split('/').pop();
          linksHtml += `<a href="${esc(item.arxivUrl)}" target="_blank" rel="noopener" class="badge badge-arxiv">arXiv:${esc(rawId)}</a>`;
        }
        if (item.inspireUrl) {
          linksHtml += `<a href="${esc(item.inspireUrl)}" target="_blank" rel="noopener" class="badge badge-inspire">inspire</a>`;
        }
        linksHtml += '</div>';

        let pubHtml = '<span class="status-preprint">Preprint</span>';
        if (item.journalRef) {
          if (item.doiUrl) {
            pubHtml = `<a href="${esc(item.doiUrl)}" target="_blank" rel="noopener" class="badge badge-pub">${formatTitleAndMath(item.journalRef)}</a>`;
          } else {
            pubHtml = `<span class="badge badge-pub">${formatTitleAndMath(item.journalRef)}</span>`;
          }
        }

        return `
          <tr>
            <td class="report-no">${esc(item.reportNumber)}</td>
            <td>
              <div class="paper-title">${formatTitleAndMath(item.title)}</div>
              <div class="paper-authors">${esc(item.authors)}</div>
            </td>
            <td>${linksHtml}</td>
            <td>${pubHtml}</td>
          </tr>
        `;
      }).join('');

      renderMath();
    }

    // $$, $, \(\), \[\] の各記法に対応した数式・テキスト整形関数
    function formatTitleAndMath(str) {
      if (!str) return '';

      // 1. $$, $, \( \), \[ \] を数式ブロックとして保護して分割（JSON由来のエスケープ \\( 等も許容）
      const parts = String(str).split(/(\$\$[\s\S]*?\$\$|\$[^\$]+?\$|\\+\[[\s\S]*?\\+\]|\\+\([\s\S]*?\\+\))/g);

      return parts.map((part, idx) => {
        // 奇数番目は数式ブロック
        if (idx % 2 === 1) {
          // 過剰なバックスラッシュを \( ... \) または \[ ... \] に統一
          let mathBlock = part.replace(/^\\+\(/, '\\(').replace(/\\+\)$/, '\\)');
          mathBlock = mathBlock.replace(/^\\+\[/, '\\[').replace(/\\+\]$/, '\\]');
          return esc(mathBlock);
        }

        let text = part;

        // 2. 数式外にある孤立した \command をピンポイントで $...$ で包む
        const safeMathRegex = /(\\[a-zA-Z]+(?:\{[^}]*\}|[\^_]\{[^}]*\}|[\^_][a-zA-Z0-9+-])*)/g;
        text = text.replace(safeMathRegex, '$$$1$$');

        // 3. 自動補正された $...$ を再度分割し、残った非数式テキストの ^ と _ を <sup> / <sub> に変換
        const subParts = text.split(/(\$[^\$]+?\$)/g);
        return subParts.map((sub, sIdx) => {
          if (sIdx % 2 === 1) {
            return esc(sub);
          }
          return esc(sub)
            .replace(/([a-zA-Z0-9\)])\^\{([^}]+)\}/g, '$1<sup>$2</sup>')
            .replace(/([a-zA-Z0-9\)])\_\{([^}]+)\}/g, '$1<sub>$2</sub>')
            .replace(/([a-zA-Z0-9\)])\^([a-zA-Z0-9+-]+)/g, '$1<sup>$2</sup>')
            .replace(/([a-zA-Z0-9\)])\_([a-zA-Z0-9]+)/g, '$1<sub>$2</sub>');
        }).join('');
      }).join('');
    }

    function renderMath() {
      if (typeof renderMathInElement === 'function') {
        const tbody = document.getElementById('pubTableBody');
        renderMathInElement(tbody, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }
    }

    const searchInput = document.getElementById('searchBox');
    const searchClear = document.getElementById('searchClear');

    searchInput.addEventListener('input', function(e) {
      const q = e.target.value.trim().toLowerCase();
      searchClear.style.display = q ? 'block' : 'none';

      if (!q) {
        renderTable(publications);
        return;
      }

      const terms = q.split(/\s+/).filter(t => t.length > 0);
      const filtered = publications.filter(item => {
        const fullText = `${item.reportNumber || ''} ${item.title || ''} ${item.authors || ''} ${item.arxivId || ''} ${item.journalRef || ''}`.toLowerCase();
        return terms.every(term => fullText.includes(term));
      });
      renderTable(filtered);
    });

    searchClear.addEventListener('click', function() {
      searchInput.value = '';
      searchClear.style.display = 'none';
      renderTable(publications);
      searchInput.focus();
    });

    function esc(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
